<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><strong data-i18n="name"></strong><button id="more" aria-label="More">·</button></header>
  <label class="muted" for="interval" data-i18n="interval"></label>
  <div class="digits"><input id="interval" type="number" min="1" max="3600" step="0.5" value="10"><span data-i18n="seconds"></span></div>
  <div class="presets"><button data-seconds="5">5</button><button data-seconds="10">10</button><button data-seconds="15">15</button><button data-seconds="30">30</button></div>
  <select id="mode" aria-label="Reading mode"><option value="combined" data-i18n="combined"></option><option value="tap" data-i18n="tap"></option><option value="scroll" data-i18n="scroll"></option></select>
  <div id="slow"><select id="kind" aria-label="Scroll style"><option value="whole" data-i18n="whole"></option><option value="halves" data-i18n="halves"></option></select><label class="duration"><span data-i18n="duration"></span><span><output id="durationValue">10</output> <span data-i18n="seconds"></span></span></label><input id="duration" type="range" min="1" max="30" value="10"></div>
  <label class="focus"><span data-i18n="focus"></span><input id="focus" type="checkbox" checked></label>
  <section id="extras" hidden><button id="pickImage" data-i18n="pickImage"></button><button id="pickNext" data-i18n="pickNext"></button><select id="language" aria-label="Language"><option value="system" data-i18n="system"></option><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select><p class="credit" data-i18n="credit"></p></section>
  <button id="start" class="primary" data-i18n="start"></button><p id="status" role="status"></p><footer data-i18n="footer"></footer>
  <script src="common.js"></script><script src="popup.js"></script>
</body></html>
